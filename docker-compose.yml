name: bobbys-petshop
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bobbys_petshop
      POSTGRES_USER: bobbys_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a private server .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bobbys_app -d bobbys_petshop"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://bobbyspetshop.cl
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bobbys_app:${POSTGRES_PASSWORD}@postgres:5432/bobbys_petshop
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in a private server .env file}
      BETTER_AUTH_URL: https://bobbyspetshop.cl
      NEXT_PUBLIC_SITE_URL: https://bobbyspetshop.cl
      ENABLE_CUSTOMER_SIGNUP: ${ENABLE_CUSTOMER_SIGNUP:-false}
      ENABLE_PAID_CHECKOUT: ${ENABLE_PAID_CHECKOUT:-false}
      MERCADOPAGO_ENVIRONMENT: ${MERCADOPAGO_ENVIRONMENT:-production}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      ORDER_NOTIFICATION_EMAIL: antonelarodil@gmail.com
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    networks:
      private: {}
      dokploy-network:
        aliases:
          - bobbys-web

networks:
  private:
  dokploy-network:
    external: true

volumes:
  postgres_data:
